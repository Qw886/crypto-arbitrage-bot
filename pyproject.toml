[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-arbitrage-bot"
version = "0.1.0"
description = "Crypto arbitrage research and controlled testnet execution with offline tests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "pydantic-settings==2.15.0"]

[project.scripts]
crypto-arbitrage-bot = "crypto_arbitrage_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_arbitrage_bot = ["config/defaults.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "work"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/crypto_arbitrage_bot"]
strict = true
plugins = ["pydantic.mypy"]

