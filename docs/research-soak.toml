# Fictional research assumptions ONLY; not exchange filters, fee advice or trading parameters.
# Run from the project root. V1 is a read-only research and validation system,
# not a live trading system. This file prepares research; it does not start a run.
# Proxy handling is unchanged: use HTTP_PROXY / HTTPS_PROXY environment variables.
# SQLite initialization safely creates missing parent directories.
# The runner waits 30 seconds AFTER each round; work time adds to the sampling gap.
# Fees, sizing, quality thresholds, scenarios and decision thresholds stay identical
# to acceptance-smoke.toml. In particular, the 60-second hypothetical scenario window
# and empty scenario funding events are retained; these are not profit predictions.
# Forward-validation horizons are separate: 1h/8h/24h replace smoke's 5s/10s windows.
# Run beyond 24h to observe 24h validations for early opportunities; late entries
# remain pending and can resume with the same database on restart.
symbols = ["BTCUSDT", "ETHUSDT"]
poll_interval_seconds = 30
log_level = "INFO"
log_dir = "logs/research"

[fees]
spot_entry = "0.001"
spot_exit = "0.001"
perp_entry = "0.0005"
perp_exit = "0.0005"

[research]
sqlite_path = "data/research/soak.sqlite"
timeout_seconds = 3
formula_version = "v1-existing-math"
config_version = "research-soak-v1"

[research.data_quality]
max_data_age = "PT10S"
max_sampling_skew = "PT2S"

[research.sizing.BTCUSDT]
target_quantity = "0.001"
stress_reserve = "0"
other_costs = "0"
[research.sizing.BTCUSDT.spot_rules]
step_size = "0.000001"
[research.sizing.BTCUSDT.perp_rules]
step_size = "0.000001"

[research.sizing.ETHUSDT]
target_quantity = "0.01"
stress_reserve = "0"
other_costs = "0"
[research.sizing.ETHUSDT.spot_rules]
step_size = "0.000001"
[research.sizing.ETHUSDT.perp_rules]
step_size = "0.000001"

[research.scenarios.BTCUSDT]
baseline = "reverse_execution"
holding_seconds = 60
spot_exit_mid_mode = "entry_mid"
convergence_exit_basis_pct = "0"
adverse_exit_basis_pct = "0.01"
funding_events = [] # Explicit hypothetical no-settlement scenario, never forward-validation history.
[research.scenarios.ETHUSDT]
baseline = "reverse_execution"
holding_seconds = 60
spot_exit_mid_mode = "entry_mid"
convergence_exit_basis_pct = "0"
adverse_exit_basis_pct = "0.01"
funding_events = []

[research.decision]
min_baseline_net_profit = "0.01"
min_baseline_net_return = "0.0001"
max_stress_loss = "1"
max_stress_loss_return = "0.02"
min_convergence_profit = "0.1"
min_scenario_margin = "0.1"
[research.decision.decision]
min_net_profit = "0.01"
min_net_return = "0.0001"
min_matched_notional = "1"
max_residual_delta = "0"
min_profit_buffer = "0.01"
pass_net_profit = "0.1"
pass_net_return = "0.001"

[research.validation_scheduler]
validation_horizons_seconds = [3600, 28800, 86400] # Research follow-ups: 1h, 8h, 24h.
batch_size = 10
# Late restart/network observations must not stand in for the intended horizon.
max_lateness_seconds = 300
# Match the scheduled funding timestamp only; retain the actual event time for PnL.
funding_time_tolerance_ms = 1000
lease_seconds = 120
max_attempts = 2
funding_page_limit = 1000
funding_max_pages = 2
