# Fictional research assumptions ONLY; not exchange filters, fee advice or trading parameters.
# Run from the project root. Separate acceptance DB; never reuse a research archive.
symbols = ["BTCUSDT", "ETHUSDT"]
poll_interval_seconds = 5
log_level = "INFO"
log_dir = "logs/testnet"

[fees]
spot_entry = "0.001"
spot_exit = "0.001"
perp_entry = "0.0005"
perp_exit = "0.0005"

[research]
sqlite_path = "data/testnet/research.sqlite"
timeout_seconds = 3
formula_version = "v1-existing-math"
config_version = "testnet-integration-v2-oi-transaction-time"

[research.data_quality]
max_data_age = "PT10S"
max_sampling_skew = "PT2S"
# Official /openInterest time is transaction time, not response publication.
# Fresh GET request/receive/observation times remain subject to the 10s gate.
open_interest_time_semantics = "last_transaction"

[research.sizing.BTCUSDT]
target_quantity = "0.001"
stress_reserve = "0"
other_costs = "0"
[research.sizing.BTCUSDT.spot_rules]
step_size = "0.000001"
[research.sizing.BTCUSDT.perp_rules]
step_size = "0.000001"

[research.sizing.ETHUSDT]
target_quantity = "0.01"
stress_reserve = "0"
other_costs = "0"
[research.sizing.ETHUSDT.spot_rules]
step_size = "0.000001"
[research.sizing.ETHUSDT.perp_rules]
step_size = "0.000001"

[research.scenarios.BTCUSDT]
baseline = "reverse_execution"
holding_seconds = 60
spot_exit_mid_mode = "entry_mid"
convergence_exit_basis_pct = "0"
adverse_exit_basis_pct = "0.01"
funding_events = [] # Explicit hypothetical no-settlement scenario, never forward-validation history.
[research.scenarios.ETHUSDT]
baseline = "reverse_execution"
holding_seconds = 60
spot_exit_mid_mode = "entry_mid"
convergence_exit_basis_pct = "0"
adverse_exit_basis_pct = "0.01"
funding_events = []

[research.decision]
min_baseline_net_profit = "0.01"
min_baseline_net_return = "0.0001"
max_stress_loss = "1"
max_stress_loss_return = "0.02"
min_convergence_profit = "0.1"
min_scenario_margin = "0.1"
[research.decision.decision]
min_net_profit = "0.01"
min_net_return = "0.0001"
min_matched_notional = "1"
max_residual_delta = "0"
min_profit_buffer = "0.01"
pass_net_profit = "0.1"
pass_net_return = "0.001"


[testnet]
environment = "TESTNET"
journal_path = "data/testnet/execution.sqlite"
max_order_notional = "250"
max_price_deviation = "0"
collateral_buffer = "0.1"
holding_seconds = 60
max_active_pairs = 2
max_total_attempts = 20
timeout_seconds = 5
max_exit_recovery_attempts = 2
# Only bounded reduce-only recovery after a terminal unfilled Perp exit.
# This is an IOC limit-price cap, not an assumed slippage or profit adjustment.
max_recovery_price_deviation = "0.001"
